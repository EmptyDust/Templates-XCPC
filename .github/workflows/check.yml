name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"
      - name: apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            poppler-utils \
            python3-pypdf \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-texgyre \
            fonts-texgyre-math \
            fonts-jetbrains-mono \
            fonts-montserrat
      - run: ./check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-and-check-logs
          include-hidden-files: true
          path: |
            build/*.pdf
            build/.check-export.log
            build/export-logs/
            build/check-logs/
            build/regression/*.log
          retention-days: 7
