name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"
      - name: apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-texgyre \
            fonts-texgyre-math \
            fonts-jetbrains-mono \
            fonts-montserrat
      - run: ./check.sh
