<style>
/* 西文 / 中文分成两个 family：缺字才回退。全部 TTF，Chromium 才能打成 CID TrueType。 */
@font-face {
  font-family: "Print Latin";
  src: url("./fonts/NotoSerif-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: "Print Latin";
  src: url("./fonts/NotoSerif-Italic.ttf") format("truetype");
  font-weight: 400;
  font-style: italic;
}
@font-face {
  font-family: "Print Latin";
  src: url("./fonts/NotoSerif-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
}
@font-face {
  font-family: "Print Latin";
  src: url("./fonts/NotoSerif-BoldItalic.ttf") format("truetype");
  font-weight: 700;
  font-style: italic;
}
@font-face {
  font-family: "Print CJK";
  src: url("./fonts/NotoSerifCJKsc-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: "Print CJK";
  src: url("./fonts/NotoSerifCJKsc-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
}
/* CJK 无斜体；不声明 italic face，Chromium 合成斜体时会把 CJK 画成 Type 3 位图。
   留 normal 两个字重即可，斜体中文回落到 Regular。 */
@font-face {
  font-family: "Print Mono";
  src: url("./fonts/JetBrainsMono-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: "Print Mono";
  src: url("./fonts/JetBrainsMono-Italic.ttf") format("truetype");
  font-weight: 400;
  font-style: italic;
}
@font-face {
  font-family: "Print Mono";
  src: url("./fonts/JetBrainsMono-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
}
@font-face {
  font-family: "Print Mono";
  src: url("./fonts/JetBrainsMono-BoldItalic.ttf") format("truetype");
  font-weight: 700;
  font-style: italic;
}
@font-face {
  font-family: "Print Mono CJK";
  src: url("./fonts/NotoSansMonoCJKsc-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
}
/* Mono CJK 只有 Regular 一个文件；bold/italic 不另声明 face，
   全部回落到 normal 400，避免 Chromium 合成加粗/斜体生成 Type 3 位图。 */

@page {
  size: A4;
  margin: 14mm 15mm 18mm;
  @bottom-center {
    content: counter(page);
    font-family: "Noto Serif", serif;
    font-size: 9pt;
    color: #444;
  }
}
/* 封面（:first）和目录（toc 命名页）不印页脚，且页码计数器归零；
   正文第一页递增为 1，即页码从正文起算。 */
@page :first {
  counter-reset: page 0;
  @bottom-center { content: none; }
}
@page toc {
  counter-reset: page 0;
  @bottom-center { content: none; }
}
/* 数学：pandoc --mathml + Chromium 原生 MathML。Termes Math 笔画与正文相配；
   \text{} 里的中文回落 Print CJK，避免系统 CFF 被打成 Type 3。 */
@font-face {
  font-family: "PrintMath";
  src: url("./fonts/TeXGyreTermesMath-Regular.ttf") format("truetype");
}
math { font-family: "PrintMath", "Print CJK"; font-size: 1em; }
html {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  text-rendering: optimizeLegibility;
  font-kerning: normal;
  font-feature-settings: "kern" 1, "liga" 1;
}
html, body, p, li, td, th {
  font-family: "Print Latin", "Print CJK";
  font-size: 10.5pt;
  line-height: 1.52;
  color: #1c1c1c;
  background: #fff;
  max-width: none !important;
  padding: 0 !important;
  margin: 0 !important;
  hyphens: none;
}
@media print {
  html, body { font-size: 10.5pt !important; color: #1c1c1c; background: #fff; }
}
h1, h2, h3, h4, h5 {
  font-family: "Print Latin", "Print CJK";
  font-weight: 700;
  line-height: 1.25;
  page-break-after: avoid;
  color: #111;
}
h1 { font-size: 17pt; letter-spacing: 0.02em; margin: 0 0 0.7em; }
/* 书名并入目录命名页，与 #TOC 同页开头，不独占封面。 */
h1.doc-title { page: toc; margin: 0 0 0.5em; }
.toc-title {
  font-size: 13pt;
  font-weight: 700;
  margin: 0 0 0.7em;
  column-span: all;
}
#TOC {
  page: toc;
  page-break-after: always;
  break-after: page;
  font-size: 9.6pt;
  line-height: 1.32;
  columns: 2;
  column-gap: 2.2em;
  column-fill: balance-all;
  margin: 0 0 1.2em;
}
#TOC ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
#TOC > ul > li {
  font-weight: 700;
  margin: 0 0 0.55em;
}
/* 章块允许跨栏拆分（否则末页栏间失衡），但章题后不许立刻断。 */
#TOC > ul > li > a {
  break-after: avoid;
}
#TOC > ul > li > ul {
  font-weight: 400;
  font-size: 9.2pt;
  margin: 0.15em 0 0 0.85em;
}
#TOC > ul > li > ul > li { margin: 0.08em 0; }
#TOC a {
  color: inherit;
  text-decoration: none;
  display: flex;
  align-items: baseline;
  gap: 0;
}
#TOC a .toc-text { flex: none; max-width: 82%; }
#TOC a .toc-dots {
  flex: 1 1 auto;
  border-bottom: 0.4pt dotted #999;
  margin: 0 0.4em;
  min-width: 0.6em;
  transform: translateY(-0.28em);
}
#TOC a .toc-page {
  flex: none;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
}
h2 {
  font-size: 15pt;
  margin: 0 0 0.9em;
  padding-bottom: 0.3em;
  border-bottom: 0.6pt solid #d5d5d5;
  page-break-before: always;
  break-before: page;
}
h3 { font-size: 11.8pt; margin: 1.3em 0 0.4em; }
h4 { font-size: 10.6pt; margin: 1.05em 0 0.35em; }
h5 { font-size: 10.5pt; margin: 0.9em 0 0.3em; }
p { margin: 0.45em 0; }
a { color: inherit; text-decoration-color: #aaa; }
pre, code, pre code, code.sourceCode, pre.sourceCode, pre.sourceCode code {
  font-family: "Print Mono", "Print Mono CJK", "Print CJK" !important;
  font-variant-ligatures: none;
  font-feature-settings: "kern" 0, "liga" 0;
}
/* 行内代码：等宽字体 + 浅色下划线。padding+负 margin 让线向左右延伸而不撑开间距 */
code {
  font-size: 0.88em;
  border-bottom: 1pt solid #cecece;
  padding: 0 0.12em;
  margin: 0 -0.12em;
}
pre {
  font-size: 8.2pt;
  line-height: 1.32;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  overflow-x: auto;
  page-break-inside: auto;
  background: #f5f5f5;
  border: none;
  border-radius: 2pt;
  padding: 0.6em 0.8em;
  margin: 0.6em 0 0.8em;
}
pre code { font-size: inherit; background: transparent; padding: 0; margin: 0; border-bottom: none; }
/* 语法高亮收敛为近单色：关键字靠字重，其余靠灰度。注释不斜体——
   斜体里的 CJK 是合成倾斜，发虚。 */
.sourceCode .kw, .sourceCode .cf { color: #111; font-weight: 700; font-style: normal; }
.sourceCode .dt { color: #1c1c1c; font-weight: 400; font-style: normal; }
.sourceCode .st, .sourceCode .sc, .sourceCode .ss { color: #4a4a4a; font-style: normal; }
.sourceCode .nu, .sourceCode .fl, .sourceCode .bn { color: #4a4a4a; font-style: normal; }
.sourceCode .co, .sourceCode .do, .sourceCode .an { color: #8a8a8a; font-style: normal; font-weight: 400; }
.sourceCode .pp, .sourceCode .im { color: #6a6a6a; font-style: normal; font-weight: 400; }
.sourceCode .fu, .sourceCode .op, .sourceCode .va, .sourceCode .at { color: inherit; font-style: normal; font-weight: 400; }
blockquote {
  margin: 0.6em 0 0.6em 0;
  padding: 0.1em 0 0.1em 0.9em;
  border-left: 1.6pt solid #c3c3c3;
  color: #333;
}
table {
  font-size: 9.5pt;
  border-collapse: collapse;
}
th, td {
  border: 0.4pt solid #ccc;
  padding: 0.2em 0.45em;
}
img { max-width: 100%; height: auto; }
div[style*="page-break-after"] {
  page-break-after: always;
  break-after: page;
  height: 0;
  overflow: hidden;
  color: transparent;
}
</style>
